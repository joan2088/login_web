<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" /> -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout_2.css">
</head>

<body>
    <!-- <div class="page-wrapper"> -->
        <div class="auth-card">
            <div class="login">
                <div class="login__logo">
                    <div class="login__logo-group">
                        <img class="login__logo-img" src="img/as_logo_4.png">
                        <h1 class="login__logo-heading">
                            資訊科學研究所<span class="login__logo-heading-en">Institute of Information Science</span>
                        </h1>
                    </div>
                    <div class="login__logo-curve">
                        <svg viewBox="0 0 2048 250" preserveAspectRatio="none">
                            <path d="M2048,282.963H0V70.951s385.111,212.012,1024,0c481.065-159.639,1024,0,1024,0v212.012Z" fill="#fff"/>
                        </svg>
                    </div>
                </div>
                <div class="login__auth">
                    <div class="login__auth-group">
                        <h2 class="login__title">選擇驗證方式
                            <span class="login__title-en">Authentication Method</span>
                        </h2>
                        <!-- <div class="msg msg--error"><i class="fa-solid fa-circle-xmark"></i> 認證失敗，帳號或密碼錯誤 / Authentication failed, invalid account or password</div>
                        <div class="msg msg--warn"><i class="fa-solid fa-triangle-exclamation"></i> 認證警告，帳號或密碼錯誤 / Authentication failed, invalid account or password</div>
                        <div class="msg msg--info"><i class="fa-solid fa-circle-exclamation"></i> 成功 / Authentication failed, invalid account or password</div> -->
                        <!-- <div class="login__account"><i class="fa-solid fa-user login__account-icon"></i>my-account000</div> -->
                        <div class="login__account"><i class="fa-solid fa-circle-user login__account-icon"></i>my-account000</div>
                        <div class="my-24">
                            <a class="btn btn--secondary mb-16" href="login_card_step3.html">FIDO Key</a>  
                            <a class="btn btn--secondary mb-16" href="login_card_step3.html">Push</a>
                            <a class="btn btn--secondary mb-16" href="login_card_step3.html">QRCode</a>
                            <a class="btn btn--secondary mb-16" href="login_card_step3.html">Password</a>
                            <a class="btn btn--secondary" href="login_card_step3.html">Password + OTP</a>                             
                        </div>
                        <div class="form-checkbox">
                            <input type="checkbox" id="trust-device" name="trust-device" value="true">
                            <label for="trust-device" class="form-checkbox__text">信任此裝置<span class="form-checkbox__text-en">Trust this device</span></label>
                        </div>                        
                        <div class="login__back">
                            <a class="link" href="login_card_step1.html">使用其他帳號 Use another username</a>
                            <!-- <button class="btn btn--link" href="login_card_step1.html">使用其他帳號 Use another username</button> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <!-- </div> -->
</body>

</html>
